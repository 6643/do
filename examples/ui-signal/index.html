<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>do UI signal runtime</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            background: #f5f7fa;
            color: #1d2939;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: start center;
        }

        main {
            width: min(720px, calc(100% - 32px));
            margin: 48px 0;
        }

        #mount {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        article {
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            background: #fff;
            padding: 20px;
            transition: border-color 120ms ease;
        }

        article.counter.active {
            border-color: #12b76a;
        }

        article strong {
            display: block;
            font-size: 40px;
            line-height: 1;
        }

        button {
            border: 1px solid #98a2b3;
            border-radius: 6px;
            background: #fff;
            color: inherit;
            cursor: pointer;
            padding: 8px 14px;
        }

        button:hover {
            background: #f2f4f7;
        }

        #remove-second {
            margin-top: 20px;
        }

        .demo-section {
            border-top: 1px solid #d0d5dd;
            margin-top: 28px;
            padding-top: 24px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        #item-list {
            display: grid;
            gap: 8px;
            list-style: none;
            margin: 16px 0 0;
            padding: 0;
        }

        #item-list li {
            align-items: center;
            background: #fff;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            display: flex;
            gap: 12px;
            justify-content: space-between;
            padding: 10px 12px;
        }

        #details {
            min-height: 24px;
            padding-top: 12px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Signal-owned counter scopes</h1>
        <p id="status">Two child scopes are mounted.</p>
        <div id="mount"></div>
        <button id="remove-second" type="button">Unmount second counter</button>

        <section class="demo-section" aria-labelledby="list-title">
            <h2 id="list-title">Keyed list</h2>
            <div class="toolbar">
                <button id="add-item" type="button">Add item</button>
                <button id="reverse-items" type="button">Reverse</button>
            </div>
            <ul id="item-list"></ul>
        </section>

        <section class="demo-section" aria-labelledby="details-title">
            <h2 id="details-title">Conditional branch</h2>
            <button id="toggle-details" type="button">Toggle details</button>
            <div id="details"></div>
        </section>
    </main>
    <script type="module" src="./demo.mjs"></script>
</body>
</html>
